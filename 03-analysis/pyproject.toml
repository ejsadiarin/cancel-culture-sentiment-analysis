[project]
name = "cancel-culture-analysis"
version = "0.1.0"
description = "Analysis stage for cancel culture sentiment analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "transformers>=4.30",
    "torch>=2.0",
    "jupyter",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

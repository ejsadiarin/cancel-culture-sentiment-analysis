[project]
name = "tiktok-scraper"
version = "0.1.0"
description = "Modular TikTok collection pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.43.0",
    "python-dateutil>=2.9.0",
    "requests>=2.31.0",
    "faster-whisper>=1.0.3",
]

[project.scripts]
tiktok-scraper = "tiktok_scraper.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
